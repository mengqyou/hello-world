name: Temporary Build CAD Dependencies

on:
  pull_request:
    branches: [master]

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          registry-url: 'https://registry.npmjs.org'
      - name: Download packages
        run: |
          npm pack meshstep@0.1.1 --registry=https://registry.npmjs.org
          npm pack occt-import-js@0.0.23 --registry=https://registry.npmjs.org
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cad-packages
          path: |
            meshstep-0.1.1.tgz
            occt-import-js-0.0.23.tgz
          if-no-files-found: error
          retention-days: 1
